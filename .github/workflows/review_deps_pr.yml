name: Review deps PR

on:
  workflow_call:
    inputs:
      pr-number:
        description: レビューする Dependabot / Renovate の PR 番号
        required: true
        type: string
    secrets:
      DEPENDABOT_ALERTS_APP_PRIVATE_KEY:
        description: Dependabot alert を参照する GitHub App の private key
        required: true

defaults:
  run:
    shell: bash

jobs:
  review:
    runs-on: ubuntu-slim
    timeout-minutes: 10 # federation rule のトークン有効期間に合わせる
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    outputs:
      pr-number: ${{ steps.pr.outputs.number }}
    steps:
      - name: Verify PR number and author
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr-number }}
        run: |
          if ! [[ "${PR_NUMBER}" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid PR number: ${PR_NUMBER}"
            exit 1
          fi
          author=$(gh pr view "${PR_NUMBER}" --json author --jq .author.login)
          case "${author}" in
            app/dependabot|app/renovate) ;;
            *)
              echo "::error::PR ${PR_NUMBER} is not created by Dependabot or Renovate: ${author}"
              exit 1
              ;;
          esac
          echo "number=${PR_NUMBER}" >> "${GITHUB_OUTPUT}"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }} # PR のコードを取り出さない
          persist-credentials: false

      # GITHUB_TOKEN では Dependabot alert を参照できないので、GitHub App のトークンで取得しておく。
      # 最小権限の原則に従い、このトークンは Claude に渡さないこと
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: Iv23liLTmtkfA2p609M7
          private-key: ${{ secrets.DEPENDABOT_ALERTS_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-vulnerability-alerts: read

      - name: Fetch Dependabot alerts
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p tmp
          gh api "repos/${GH_REPO}/dependabot/alerts?state=open&per_page=100" --paginate --slurp \
            | jq 'add // []' > tmp/dependabot-alerts.json
          echo "open な Dependabot alert: $(jq length tmp/dependabot-alerts.json) 件"

      # claude-code-action は作業ディレクトリの .claude/ を PR のベースブランチの内容に戻すので、
      # スキルはユーザーレベルの ~/.claude/skills/ に置く
      - name: Checkout skill
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: masutaka/dotfiles-public
          path: dotfiles-public
          persist-credentials: false
          sparse-checkout: |
            /.claude/skills/my-review-deps-pr/
          sparse-checkout-cone-mode: false

      # スキルは ghro（read-only の gh）を使う前提なので、gh へのシンボリックリンクとして ghro を置く。
      # GH_TOKEN には read-only の GITHUB_TOKEN を渡す
      - name: Set up skill and ghro
        run: |
          mkdir -p ~/.claude/skills ~/.local/bin
          cp -R dotfiles-public/.claude/skills/my-review-deps-pr ~/.claude/skills/
          rm -rf dotfiles-public
          ln -s "$(command -v gh)" ~/.local/bin/ghro
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Review PR
        id: claude
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        with:
          # 共通の federation rule。job_workflow_ref でこの reusable workflow の main に限定している
          anthropic_federation_rule_id: ${{ github.event_name == 'workflow_dispatch' && 'fdrl_01GD7sDFaX6dNJ2giR523H6C' || 'fdrl_01MZdbfy54rQ8hntGCGwtsxa' }}
          anthropic_organization_id: d170801b-83d8-4eda-88e6-bc31733e7266
          anthropic_service_account_id: svac_01Hv2ida4TpQJuoWG9HAaTEC
          github_token: ${{ github.token }}
          allowed_bots: dependabot[bot],renovate[bot]
          prompt: /my-review-deps-pr https://github.com/${{ github.repository }}/pull/${{ steps.pr.outputs.number }}
          claude_args: >-
            --allowedTools "Bash(ghro pr view:*),Bash(ghro pr diff:*),Bash(ghro api:*),Bash(ghro pr checks:*),Bash(gh pr checks:*),Read,Write"
            --append-system-prompt "Dependabot alert の一覧は tmp/dependabot-alerts.json に取得済み（state=open の全件で、API のレスポンスそのもの）。alert API は権限がなく呼べないので、このファイルを Read で読むこと。許可されたコマンドしか実行できないので、cd や ; や && でつながず、コマンドは 1 つずつ実行すること。"

      # claude-code-action は出力を隠すので、拒否されたツールと、失敗したときは結果の本文だけを出す
      - name: Show Claude result
        if: always() && steps.claude.outcome != 'skipped'
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file || format('{0}/claude-execution-output.json', runner.temp) }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
        run: |
          result=$(jq -c '[.. | objects | select(.type? == "result")] | last' "${EXECUTION_FILE}")
          jq -r '.permission_denials[]? | "denied: \(.tool_name) \(.tool_input | tostring | .[0:300])"' <<< "${result}"
          if [[ "${CLAUDE_OUTCOME}" == failure ]]; then
            jq -r '.result // empty' <<< "${result}"
          fi

      - name: Upload review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review
          path: tmp/docs/pr-review-${{ steps.pr.outputs.number }}.md
          if-no-files-found: error
          retention-days: 1

  comment:
    needs: review
    runs-on: ubuntu-slim
    timeout-minutes: 1
    permissions:
      pull-requests: write
    steps:
      - name: Download review
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: review

      - name: Post review as PR comment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.review.outputs.pr-number }}
        run: gh pr comment "${PR_NUMBER}" --body-file "pr-review-${PR_NUMBER}.md"
