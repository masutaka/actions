name: Review deps PR

on:
  workflow_call:
    inputs:
      pr-number:
        description: レビューする Dependabot / Renovate の PR 番号
        required: true
        type: string

defaults:
  run:
    shell: bash

jobs:
  review:
    runs-on: ubuntu-slim
    timeout-minutes: 10 # federation rule のトークン有効期間に合わせる
    permissions:
      contents: read
      id-token: write
      pull-requests: read
      security-events: read
    outputs:
      pr-number: ${{ steps.pr.outputs.number }}
    steps:
      - name: Verify PR number and author
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr-number }}
        run: |
          if ! [[ "${PR_NUMBER}" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid PR number: ${PR_NUMBER}"
            exit 1
          fi
          author=$(gh pr view "${PR_NUMBER}" --json author --jq .author.login)
          case "${author}" in
            app/dependabot|app/renovate) ;;
            *)
              echo "::error::PR ${PR_NUMBER} is not created by Dependabot or Renovate: ${author}"
              exit 1
              ;;
          esac
          echo "number=${PR_NUMBER}" >> "${GITHUB_OUTPUT}"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }} # PR のコードを取り出さない
          persist-credentials: false

      # claude-code-action は作業ディレクトリの .claude/ を PR のベースブランチの内容に戻すので、
      # スキルはユーザーレベルの ~/.claude/skills/ に置く
      - name: Checkout skill
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: masutaka/dotfiles-public
          path: dotfiles-public
          persist-credentials: false
          sparse-checkout: |
            /.claude/skills/my-review-deps-pr/
          sparse-checkout-cone-mode: false

      # スキルは ghro（read-only の gh）を使う前提なので、gh へのシンボリックリンクとして ghro を置く。
      # GH_TOKEN には read-only の GITHUB_TOKEN を渡す
      - name: Set up skill and ghro
        run: |
          mkdir -p ~/.claude/skills ~/.local/bin
          cp -R dotfiles-public/.claude/skills/my-review-deps-pr ~/.claude/skills/
          rm -rf dotfiles-public
          ln -s "$(command -v gh)" ~/.local/bin/ghro
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Review PR
        id: claude
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        with:
          # 共通の federation rule。job_workflow_ref でこの reusable workflow の main に限定している
          anthropic_federation_rule_id: ${{ github.event_name == 'workflow_dispatch' && 'fdrl_01GD7sDFaX6dNJ2giR523H6C' || 'fdrl_01MZdbfy54rQ8hntGCGwtsxa' }}
          anthropic_organization_id: d170801b-83d8-4eda-88e6-bc31733e7266
          anthropic_service_account_id: svac_01Hv2ida4TpQJuoWG9HAaTEC
          github_token: ${{ github.token }}
          allowed_bots: dependabot[bot],renovate[bot]
          prompt: /my-review-deps-pr https://github.com/${{ github.repository }}/pull/${{ steps.pr.outputs.number }}
          claude_args: >-
            --allowedTools "Bash(ghro pr view:*),Bash(ghro pr diff:*),Bash(ghro api:*),Bash(gh pr checks:*),Read,Write"

      # claude-code-action は出力を隠すので、失敗したときは結果の本文だけを出す
      - name: Show Claude error
        if: failure()
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file || format('{0}/claude-execution-output.json', runner.temp) }}
        run: jq -r '.. | objects | select(.type? == "result") | .result // empty' "${EXECUTION_FILE}"

      - name: Upload review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review
          path: tmp/docs/pr-review-${{ steps.pr.outputs.number }}.md
          if-no-files-found: error
          retention-days: 1

  comment:
    needs: review
    runs-on: ubuntu-slim
    timeout-minutes: 1
    permissions:
      pull-requests: write
    steps:
      - name: Download review
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: review

      - name: Post review as PR comment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.review.outputs.pr-number }}
        run: gh pr comment "${PR_NUMBER}" --body-file "pr-review-${PR_NUMBER}.md"
