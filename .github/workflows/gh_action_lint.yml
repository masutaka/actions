name: gh_action_lint

on:
  workflow_call:

defaults:
  run:
    shell: bash

jobs:
  ghalint:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install ghalint
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: suzuki-shunsuke/ghalint
          ASSET: "*_linux_amd64.tar.gz"
          # renovate: depName=suzuki-shunsuke/ghalint
          TAG: v1.6.0
          ASSET_SHA256: eda1af79c1a4a31c2de5831cd1333ad582fa6fa72015f8e9c1c4525d550c1d35
          # 署名は ghalint の release.yaml から呼ばれる reusable workflow で行われるため、そちらを指定する
          SIGNER_WORKFLOW: suzuki-shunsuke/go-release-workflow/.github/workflows/release.yaml
          EXECUTABLE: ghalint
        run: |
          gh release download "$TAG" \
            --repo "$REPO" \
            --pattern "$ASSET" \
            --output asset.tar.gz
          # 正規の release workflow がそのタグからビルドした成果物であることを検証する
          gh attestation verify asset.tar.gz \
            --repo "$REPO" \
            --signer-workflow "$SIGNER_WORKFLOW" \
            --source-ref "refs/tags/$TAG"
          # ピンした時点から中身が変わっていないことを検証する
          echo "${ASSET_SHA256}  asset.tar.gz" | sha256sum -c -
          tar -xzf asset.tar.gz "$EXECUTABLE"
      # 呼び出し側に設定ファイルを置かずに済むよう、ここで生成する
      - name: Generate ghalint config
        run: |
          cat > "$RUNNER_TEMP/ghalint.yml" <<'EOF'
          excludes:
            - policy_name: action_ref_should_be_full_length_commit_sha
              action_name: masutaka/actions/.github/workflows/*.yml
          EOF
      - name: Run ghalint
        env:
          GHALINT_CONFIG: ${{ runner.temp }}/ghalint.yml
        run: ./ghalint run
      - name: Run ghalint run-action
        env:
          GHALINT_CONFIG: ${{ runner.temp }}/ghalint.yml
        run: ./ghalint run-action

  jactionlint:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install jactionlint
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: jdx/jactionlint
          ASSET: "*_linux_amd64.tar.gz"
          # renovate: depName=jdx/jactionlint
          TAG: v2.3.0
          ASSET_SHA256: 907e6f6a59e181879f7e6936e19ee2eca1cbc51de134fb85460cfa8d65a71f28
          SIGNER_WORKFLOW: jdx/jactionlint/.github/workflows/release.yaml
          EXECUTABLE: jactionlint
        run: |
          gh release download "$TAG" \
            --repo "$REPO" \
            --pattern "$ASSET" \
            --output asset.tar.gz
          # 正規の release workflow がそのタグからビルドした成果物であることを検証する
          gh attestation verify asset.tar.gz \
            --repo "$REPO" \
            --signer-workflow "$SIGNER_WORKFLOW" \
            --source-ref "refs/tags/$TAG"
          # ピンした時点から中身が変わっていないことを検証する
          echo "${ASSET_SHA256}  asset.tar.gz" | sha256sum -c -
          tar -xzf asset.tar.gz "$EXECUTABLE"
      # 呼び出し側に設定ファイルを置かずに済むよう、ここで生成する
      - name: Generate jactionlint config
        run: |
          cat > "$RUNNER_TEMP/jactionlint.yml" <<'EOF'
          rules:
            # すべてのワークフローに concurrency を求めるのは過剰なため off にする（zizmor の default でも指摘しない）
            concurrency-limits: off
            # 攻撃者が操作できる値かどうかに関係なく、run: には式を直接展開せず env 経由で渡させるため pedantic にする（zizmor の regular persona より厳しい）
            template-injection:
              pedantic: true
            unpinned-uses:
              policies:
                masutaka/actions: ref-pin
          EOF
      - name: Run jactionlint
        env:
          GITHUB_TOKEN: ${{ github.token }} # --online で使う
        run: ./jactionlint --color --online --config-file "$RUNNER_TEMP/jactionlint.yml"

  zizmor:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 呼び出し側に設定ファイルを置かずに済むよう、ここで生成する
      - name: Generate zizmor config
        run: |
          cat > "$RUNNER_TEMP/zizmor.yml" <<'EOF'
          rules:
            unpinned-uses:
              config:
                policies:
                  masutaka/actions/*: ref-pin
          EOF
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false # true にすると SARIF 出力になり、findings があっても exit 0 で CI が落ちないため
          annotations: true
          config: ${{ runner.temp }}/zizmor.yml
