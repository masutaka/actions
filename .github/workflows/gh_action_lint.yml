name: gh_action_lint

on:
  workflow_call:

defaults:
  run:
    shell: bash

jobs:
  actionlint:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: rhysd/actionlint
          ASSET: "*_linux_amd64.tar.gz"
          # renovate: depName=rhysd/actionlint
          TAG: v1.7.12
          ASSET_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          SIGNER_WORKFLOW: rhysd/actionlint/.github/workflows/release.yaml
          EXECUTABLE: actionlint
        run: |
          gh release download "$TAG" \
            --repo "$REPO" \
            --pattern "$ASSET" \
            --output asset.tar.gz
          # 正規の release workflow がビルドした成果物であることを検証する
          gh attestation verify asset.tar.gz \
            --repo "$REPO" \
            --signer-workflow "$SIGNER_WORKFLOW"
          # ピンした時点から中身が変わっていないことを検証する
          echo "${ASSET_SHA256}  asset.tar.gz" | sha256sum -c -
          tar -xzf asset.tar.gz "$EXECUTABLE"
      - name: Run actionlint
        # actionlint v1.7.12 は以下に未対応のため、そのエラーだけ無視する
        # - concurrency の queue
        # - self-repository 構文 ($/...) の action と reusable workflow 呼び出し https://github.com/rhysd/actionlint/issues/711
        run: |
          ./actionlint -color \
            -ignore 'unexpected key "queue" for "concurrency" section' \
            -ignore 'specifying action "\$/' \
            -ignore 'reusable workflow call "\$/'

  ghalint:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install ghalint
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: suzuki-shunsuke/ghalint
          ASSET: "*_linux_amd64.tar.gz"
          # renovate: depName=suzuki-shunsuke/ghalint
          TAG: v1.5.6
          ASSET_SHA256: 98ee0e3330de7286f470d1e89c03ff7ce70d7a5998ba0f15969c400447be579c
          # 署名は ghalint の release.yaml から呼ばれる reusable workflow で行われるため、そちらを指定する
          SIGNER_WORKFLOW: suzuki-shunsuke/go-release-workflow/.github/workflows/release.yaml
          EXECUTABLE: ghalint
        run: |
          gh release download "$TAG" \
            --repo "$REPO" \
            --pattern "$ASSET" \
            --output asset.tar.gz
          # 正規の release workflow がビルドした成果物であることを検証する
          gh attestation verify asset.tar.gz \
            --repo "$REPO" \
            --signer-workflow "$SIGNER_WORKFLOW"
          # ピンした時点から中身が変わっていないことを検証する
          echo "${ASSET_SHA256}  asset.tar.gz" | sha256sum -c -
          tar -xzf asset.tar.gz "$EXECUTABLE"
      # 呼び出し側に設定ファイルを置かずに済むよう、ここで生成する
      - name: Generate ghalint config
        run: |
          cat > "$RUNNER_TEMP/ghalint.yml" <<'EOF'
          excludes:
            - policy_name: action_ref_should_be_full_length_commit_sha
              action_name: masutaka/actions/.github/workflows/*.yml
          EOF
      - name: Run ghalint
        env:
          GHALINT_CONFIG: ${{ runner.temp }}/ghalint.yml
        run: ./ghalint run
      - name: Run ghalint run-action
        env:
          GHALINT_CONFIG: ${{ runner.temp }}/ghalint.yml
        run: ./ghalint run-action

  jactionlint:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install jactionlint
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: jdx/jactionlint
          ASSET: "*_linux_amd64.tar.gz"
          # renovate: depName=jdx/jactionlint
          TAG: v2.0.2
          ASSET_SHA256: 026bce6d0ef196f5b22bf43acb1348d47c5d0a5ae61d6ec3bdba1229a823161b
          SIGNER_WORKFLOW: jdx/jactionlint/.github/workflows/release.yaml
          EXECUTABLE: jactionlint
        run: |
          gh release download "$TAG" \
            --repo "$REPO" \
            --pattern "$ASSET" \
            --output asset.tar.gz
          # 正規の release workflow がビルドした成果物であることを検証する
          gh attestation verify asset.tar.gz \
            --repo "$REPO" \
            --signer-workflow "$SIGNER_WORKFLOW"
          # ピンした時点から中身が変わっていないことを検証する
          echo "${ASSET_SHA256}  asset.tar.gz" | sha256sum -c -
          tar -xzf asset.tar.gz "$EXECUTABLE"
      # 呼び出し側に設定ファイルを置かずに済むよう、ここで生成する
      # concurrency-limits は zizmor の default でも出ない指摘のため off にする
      - name: Generate jactionlint config
        run: |
          cat > "$RUNNER_TEMP/jactionlint.yml" <<'EOF'
          rules:
            concurrency-limits: off
            unpinned-uses:
              policies:
                masutaka/actions: ref-pin
          EOF
      - name: Run jactionlint
        env:
          GITHUB_TOKEN: ${{ github.token }} # --online で使う
        run: ./jactionlint --color --online --config-file "$RUNNER_TEMP/jactionlint.yml"

  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 呼び出し側に設定ファイルを置かずに済むよう、ここで生成する
      # zizmor-action は GITHUB_WORKSPACE だけを Docker にマウントするため、RUNNER_TEMP ではなくワークスペース内に置く
      - name: Generate zizmor config
        run: |
          cat > .masutaka-actions-zizmor.yml <<'EOF'
          rules:
            unpinned-uses:
              config:
                policies:
                  masutaka/actions/*: ref-pin
          EOF
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false # true にすると SARIF 出力になり、findings があっても exit 0 で CI が落ちないため
          annotations: true
          config: .masutaka-actions-zizmor.yml
