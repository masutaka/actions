name: ghalint

on:
  workflow_call:

env:
  GHALINT_VERSION: 1.5.6
  GHALINT_CHECKSUM: 98ee0e3330de7286f470d1e89c03ff7ce70d7a5998ba0f15969c400447be579c

jobs:
  ghalint:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run ghalint
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tarball="ghalint_${GHALINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -O "https://github.com/suzuki-shunsuke/ghalint/releases/download/v${GHALINT_VERSION}/${tarball}"
          # 正規の release workflow がビルドした成果物であることを検証する
          # 署名は ghalint の release.yaml から呼ばれる reusable workflow で行われるため、そちらを signer に指定する
          gh attestation verify "$tarball" \
            --repo suzuki-shunsuke/ghalint \
            --signer-workflow suzuki-shunsuke/go-release-workflow/.github/workflows/release.yaml
          # ピンした時点から中身が変わっていないことを検証する
          echo "${GHALINT_CHECKSUM}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" ghalint
          ./ghalint run
