name: Pushover

on:
  workflow_call:
    inputs:
      status:
        description: "ジョブの結果。success を渡すと成功通知になる"
        type: string
        default: "failure"
      title:
        description: "通知のタイトル。空なら Failed <repository>'s workflow (<workflow>)"
        type: string
        default: ""
      priority:
        description: "通知の優先度 (-2 〜 1)"
        type: number
        default: 1 # High
      sound:
        description: "通知音"
        type: string
        default: "falling"
    secrets:
      PUSHOVER_API_KEY:
        required: true
      PUSHOVER_USER_KEY:
        required: true

jobs:
  pushover:
    runs-on: ubuntu-slim
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Send a Pushover notification
        env:
          PUSHOVER_API_KEY: ${{ secrets.PUSHOVER_API_KEY }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          STATUS: ${{ inputs.status }}
          TITLE: ${{ inputs.title != '' && inputs.title || format('Failed {0}''s workflow ({1})', github.repository, github.workflow) }}
          URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          PRIORITY: ${{ inputs.priority }}
          SOUND: ${{ inputs.sound }}
        # --retry の対象は 408/429/5xx とタイムアウト・接続エラーのみ。
        # パラメータ不正などの 4xx は --fail-with-body でそのまま失敗させる
        run: |
          message=$(printf 'Repo: %s\nCommit: %s\nRef: %s\nStatus: %s' \
            "$GITHUB_REPOSITORY" "${GITHUB_SHA:0:8}" "$GITHUB_REF" "$STATUS")
          curl -sS --fail-with-body \
            --max-time 30 --retry 3 --retry-delay 5 --retry-connrefused \
            --data-urlencode "token=$PUSHOVER_API_KEY" \
            --data-urlencode "user=$PUSHOVER_USER_KEY" \
            --data-urlencode "message=$message" \
            --data-urlencode "title=$TITLE" \
            --data-urlencode "url=$URL" \
            --data-urlencode "priority=$PRIORITY" \
            --data-urlencode "sound=$SOUND" \
            https://api.pushover.net/1/messages.json
          echo
